<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | Мир видеоигр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">

    <header class="header">
        <h1 class="header__title">Мир видеоигр</h1>
        <p class="header__subtitle">Персональный проект о шедеврах игровой индустрии</p>
    </header>

    <main class="container">
        <nav class="nav">
            <a href="index.html" class="nav__link">Главная</a>
            <a href="games.html" class="nav__link">Любимые ААА-игры</a>
            <a href="about.html" class="nav__link">Об авторе</a>
            <a href="form.html" class="nav__link nav__link_active">Авторизация</a>
        </nav>

        <section class="section">
            <h2 class="section__title">Авторизация пользователя</h2>

            <form class="auth-form card" id="authForm">
                <!-- Тип поля 1: text -->
                <div class="auth-form__field">
                    <label class="auth-form__label" for="login">Логин:</label>
                    <input class="auth-form__input" type="text" id="login" name="login" placeholder="Введите логин" required>
                </div>

                <!-- Тип поля 2: password -->
                <div class="auth-form__field">
                    <label class="auth-form__label" for="password">Пароль:</label>
                    <input class="auth-form__input" type="password" id="password" name="password" placeholder="Введите пароль" required>
                </div>

                <!-- Тип поля 3: checkbox -->
                <label class="auth-form__checkbox-group">
                    <input type="checkbox" name="agreement">
                    <span>Согласен на обработку персональных данных</span>
                </label>

                <!-- Кнопка отправки данных -->
                <button class="auth-form__button" type="submit">Отправить на сервер</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
